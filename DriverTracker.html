<!-- Search Section -->
    <div class="card">
        <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:8px;">ড্রাইভার কোড দিয়ে খুঁজুন (Search by Driver Code)</label>
        <div class="search-box">
            <!-- Editable Dropdown (Datalist) -->
            <input type="text" id="adminDriverCode" list="driverCodesList" placeholder="DRV-001">
            <datalist id="driverCodesList">
                <option value="DRV-001"></option>
                <option value="DRV-002"></option>
                <option value="DRV-003"></option>
                <option value="DRV-004"></option>
                <option value="DRV-005"></option>
                <option value="DRV-006"></option>
                <option value="DRV-007"></option>
                <option value="DRV-008"></option>
                <option value="DRV-009"></option>
                <option value="DRV-010"></option>
            </datalist>
            
            <button class="btn-search" onclick="startTracking()">Track 🔍</button>
        </div>
        <p id="errorMsg" style="color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; font-weight: 600;"></p>
    </div>

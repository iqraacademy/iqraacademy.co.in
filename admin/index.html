  <script>
    // --- Pure JavaScript SHA-256 Engine ---
    function sha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = 'length';
      var i, j;
      var result = '';
      var words = [];
      var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
      words[words[lengthProperty]] = asciiBitLength;
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var temp1 = hash[7]
            + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25))
            + ((hash[4] & hash[5]) ^ ((~hash[4]) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0);
          var temp2 = (rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22))
            + ((hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    const DEFAULT_HASH_L2 = "a85e9db4851f7cd3efb8db7bf69a07cfb97bc528b72785a9cff7bdfef7e2279d";

    const DEFAULT_IQRA_STORE = {
      announcement: "📢 ভর্তি চলছে ২০২৭ শিক্ষাবর্ষে! Pre-Nursery থেকে Class IX পর্যন্ত অনাবাসিক, ডে-বোর্ডিং ও আবাসিক বালিকা বিভাগে (Class V-IX) সীমিত আসনে ভর্তি চলছে। যোগাযোগ: ৯৭৭৫১২৩০৯৬ / ৯৬৪৭১০৯৪৮১",
      banners: [

        { url: "https://res.cloudinary.com/u0z4riei/image/upload/v1792240666/4.jpg", title: "সুপারভাইজড স্টাডি ও হোস্টেল কেয়ার" },
        { url: "https://res.cloudinary.com/u0z4riei/image/upload/v1792240666/1.jpg", title: "দ্বীনি ও নৈতিক মূল্যবোধের বিকাশ" },
        { url: "https://res.cloudinary.com/u0z4riei/image/upload/v1792240666/5.jpg", title: "ডে-বোর্ডিং ও সহশিক্ষা কার্যক্রম" }
      ],
      notices: [
        { id: "not-1", date: "২০২৬-১০-১৫", category: "ভর্তি", title: "২০২৭ শিক্ষাবর্ষে নতুন ভর্তি ফরম বিতরণ চলছে (Pre-Nursery - Class IX)", priority: "উচ্চ" },
        { id: "not-2", date: "২০২৬-১০-১০", category: "আবাসিক", title: "আবাসিক বালিকা বিভাগের আসন সংরক্ষণ ও হোস্টেল নির্দেশিকা প্রকাশ", priority: "জরুরি" },
        { id: "not-3", date: "২০২৬-১০-০৫", category: "ডে-বোর্ডিং", title: "ডে-বোর্ডিং শিক্ষার্থীদের জন্য পুষ্টিকর খাদ্য তালিকা ও স্টাডি রুটিন হালনাগাদ", priority: "সাধারণ" },
        { id: "not-4", date: "২০২৬-০৯-২৮", category: "পরীক্ষা", title: "আসন্ন মূল্যায়নী পরীক্ষার সময়সূচি ও অভিভাবক সমন্বয় সভা", priority: "সাধারণ" }
      ],
      applications: [
        { id: "IQRA-2027-101", studentName: "আফরোজা খাতুন", guardianName: "মতিউর রহমান", stream: "আবাসিক (Residential Girls)", classApply: "Class VI", phone: "9832104567", status: "ভর্তি নিশ্চিত", date: "২০২৬-১০-১৪" },
        { id: "IQRA-2027-102", studentName: "সামিয়া পারভীন", guardianName: "রফিকুল ইসলাম", stream: "ডে-বোর্ডিং (Day Boarding)", classApply: "Class III", phone: "9733458912", status: "যাচাই চলছে", date: "২০২৬-১০-১৬" },
        { id: "IQRA-2027-103", studentName: "ফারহানা সুলতানা", guardianName: "আকবর আলী", stream: "অনাবাসিক (Day Scholar)", classApply: "Class I", phone: "9647890123", status: "নতুন আবেদন", date: "২০২৬-১০-১৭" }
      ],
      stats: {
        students: "৫০০+",
        teachers: "২৫+",
        passRate: "১০০%",
        estd: "২০১৫",
        helpline1: "9775123096",
        helpline2: "9647109481"
      },
      adminHashL1: DEFAULT_HASH_L1,
      adminHashL2: DEFAULT_HASH_L2
    };

    function loadStore() {
      try {
        const raw = localStorage.getItem('iqra_academy_data');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            parsed.announcement = parsed.announcement || DEFAULT_IQRA_STORE.announcement;
            parsed.banners = (Array.isArray(parsed.banners) && parsed.banners.length >= 5) ? parsed.banners : DEFAULT_IQRA_STORE.banners;
            parsed.notices = Array.isArray(parsed.notices) ? parsed.notices : DEFAULT_IQRA_STORE.notices;
            parsed.applications = Array.isArray(parsed.applications) ? parsed.applications : DEFAULT_IQRA_STORE.applications;
            parsed.stats = parsed.stats || DEFAULT_IQRA_STORE.stats;
            parsed.adminHashL1 = parsed.adminHashL1 || DEFAULT_HASH_L1;
            parsed.adminHashL2 = parsed.adminHashL2 || DEFAULT_HASH_L2;
            return parsed;
          }
        }
      } catch(e) {}
      try {
        localStorage.setItem('iqra_academy_data', JSON.stringify(DEFAULT_IQRA_STORE));
      } catch(e) {}
      return DEFAULT_IQRA_STORE;
    }

    function saveStore(data) {
      try {
        localStorage.setItem('iqra_academy_data', JSON.stringify(data));
      } catch(e) {}
    }

    let appState = loadStore();

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-xl shadow-xl text-xs md:text-sm font-bold flex items-center gap-2 transform transition-all duration-300 pointer-events-auto ${
        type === 'success' ? 'bg-emerald-800 text-white border border-emerald-600' : 'bg-red-800 text-white border border-red-600'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-amber-300' : 'fa-circle-exclamation text-amber-300'}"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    const lockScreen = document.getElementById('admin-lock-screen');
    const mainDashboard = document.getElementById('admin-main-dashboard');
    const loginForm = document.getElementById('admin-login-form');
    const passInput = document.getElementById('login-pass-input');
    const pinInput = document.getElementById('login-pin-input');
    const loginErrorMsg = document.getElementById('login-error-msg');
    const loginErrorText = document.getElementById('login-error-text');
    const btnTogglePass = document.getElementById('btn-toggle-login-pass');
    const togglePassIcon = document.getElementById('toggle-login-pass-icon');
    const btnTogglePin = document.getElementById('btn-toggle-login-pin');
    const togglePinIcon = document.getElementById('toggle-login-pin-icon');
    const btnLogout = document.getElementById('btn-admin-logout');

    function checkAuth() {
      try {
        const isAuth = (sessionStorage.getItem('iqra_admin_auth') === 'true') || (localStorage.getItem('iqra_admin_temp_auth') === 'true');
        if (isAuth) {
          if (lockScreen) {
            lockScreen.classList.add('hidden');
            lockScreen.style.display = 'none';
          }
          if (mainDashboard) {
            mainDashboard.classList.remove('hidden');
            mainDashboard.style.display = 'block';
          }
          renderDashboard();
        } else {
          if (lockScreen) {
            lockScreen.classList.remove('hidden');
            lockScreen.style.display = 'flex';
          }
          if (mainDashboard) {
            mainDashboard.classList.add('hidden');
            mainDashboard.style.display = 'none';
          }
          if (passInput) passInput.value = '';
          if (pinInput) pinInput.value = '';
          if (loginErrorMsg) loginErrorMsg.classList.add('hidden');
        }
      } catch(err) {
        console.error('checkAuth error:', err);
      }
    }

    if (btnTogglePass && passInput && togglePassIcon) {
      btnTogglePass.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        togglePassIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });
    }

    if (btnTogglePin && pinInput && togglePinIcon) {
      btnTogglePin.addEventListener('click', () => {
        const isPass = pinInput.type === 'password';
        pinInput.type = isPass ? 'text' : 'password';
        togglePinIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });
    }

    function handleLoginSubmit(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      try {
        const p = (passInput ? passInput.value : '').trim();
        const pin = (pinInput ? pinInput.value : '').trim();

        if (!p || !pin) {
          if (loginErrorText) loginErrorText.textContent = 'অনুগ্রহ করে পাসওয়ার্ড ও পিন উভয়ই লিখুন!';
          if (loginErrorMsg) loginErrorMsg.classList.remove('hidden');
          return false;
        }

        const hashedP = sha256(p);
        const hashedPin = sha256(pin);

        appState = loadStore();
        const targetHashL1 = appState.adminHashL1 || DEFAULT_HASH_L1;
        const targetHashL2 = appState.adminHashL2 || DEFAULT_HASH_L2;

        const passOk = (hashedP === targetHashL1);
        const pinOk = (hashedPin === targetHashL2);

        if (passOk && pinOk) {
          sessionStorage.setItem('iqra_admin_auth', 'true');
          localStorage.setItem('iqra_admin_temp_auth', 'true');
          
          if (loginErrorMsg) loginErrorMsg.classList.add('hidden');

          // Force Instant DOM Transition to Dashboard
          if (lockScreen) {
            lockScreen.classList.add('hidden');
            lockScreen.style.display = 'none';
          }
          if (mainDashboard) {
            mainDashboard.classList.remove('hidden');
            mainDashboard.style.display = 'block';
          }

          renderDashboard();
          showToast('স্বাগতম! দ্বি-স্তরীয় ভেরিফিকেশন সফল। পোর্টাল আনলক হয়েছে।');
          return false;
        } else {
          if (loginErrorText) {
            if (!passOk && !pinOk) {
              loginErrorText.textContent = 'লেয়ার ১ পাসওয়ার্ড এবং লেয়ার ২ পিন উভয়ই ভুল!';
            } else if (!passOk) {
              loginErrorText.textContent = 'লেয়ার ১ অ্যাডমিন পাসওয়ার্ড ভুল!';
            } else {
              loginErrorText.textContent = 'লেয়ার ২ মাস্টার পিন ভুল!';
            }
          }
          if (loginErrorMsg) loginErrorMsg.classList.remove('hidden');
          return false;
        }
      } catch(err) {
        console.error('Login error:', err);
        return false;
      }
    }

    if (loginForm) {
      loginForm.addEventListener('submit', handleLoginSubmit);
    }

    const btnLoginSubmit = document.getElementById('btn-login-submit');
    if (btnLoginSubmit) {
      btnLoginSubmit.addEventListener('click', (e) => {
        handleLoginSubmit(e);
      });
    }

    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        sessionStorage.removeItem('iqra_admin_auth');
        localStorage.removeItem('iqra_admin_temp_auth');
        checkAuth();
        showToast('অ্যাডমিন পোর্টাল নিরাপদে লক করা হয়েছে।');
      });
    }

    // --- Tab Switching ---
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-tab');
        document.querySelectorAll('.admin-tab-btn').forEach(b => {
          b.classList.remove('active', 'bg-amber-500', 'text-slate-950');
          b.classList.add('bg-slate-800', 'text-slate-300');
        });
        btn.classList.add('active', 'bg-amber-500', 'text-slate-950');
        btn.classList.remove('bg-slate-800', 'text-slate-300');

        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
        const activeContent = document.getElementById(targetId);
        if (activeContent) activeContent.classList.remove('hidden');
      });
    });

    function renderDashboard() {
      try {
        appState = loadStore();

        // Marquee
        const marqueeInput = document.getElementById('admin-marquee-input');
        if (marqueeInput) marqueeInput.value = appState.announcement || '';

        // Notices
        renderNotices();

        // Admissions
        renderApplications();

        // Banners
        renderBanners();

        // Stats
        if (appState.stats) {
          if (document.getElementById('admin-stat-students')) document.getElementById('admin-stat-students').value = appState.stats.students || '৫০০+';
          if (document.getElementById('admin-stat-teachers')) document.getElementById('admin-stat-teachers').value = appState.stats.teachers || '২৫+';
          if (document.getElementById('admin-stat-pass')) document.getElementById('admin-stat-pass').value = appState.stats.passRate || '১০০%';
          if (document.getElementById('admin-stat-phone1')) document.getElementById('admin-stat-phone1').value = appState.stats.helpline1 || '9775123096';
          if (document.getElementById('admin-stat-phone2')) document.getElementById('admin-stat-phone2').value = appState.stats.helpline2 || '9647109481';
          if (document.getElementById('admin-stat-estd')) document.getElementById('admin-stat-estd').value = appState.stats.estd || '২০১৫';
        }
      } catch(err) {
        console.error('renderDashboard error:', err);
      }
    }

    function renderNotices() {
      const noticeTbody = document.getElementById('admin-notice-table-body');
      if (!noticeTbody || !appState.notices) return;
      noticeTbody.innerHTML = appState.notices.map((n, idx) => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 font-mono text-slate-400">${n.date}</td>
          <td class="p-3"><span class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-amber-300 text-[11px]">${n.category}</span></td>
          <td class="p-3 font-medium text-white">${n.title}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${n.priority === 'জরুরি' ? 'bg-red-950 text-red-300 border border-red-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}">${n.priority}</span>
          </td>
          <td class="p-3 text-right">
            <button class="text-red-400 hover:text-red-300 p-1 font-bold text-xs" onclick="deleteNotice(${idx})">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    window.deleteNotice = function(index) {
      appState.notices.splice(index, 1);
      saveStore(appState);
      renderNotices();
      showToast('নোটিশটি মুছে ফেলা হয়েছে।');
    };

    const addNoticeForm = document.getElementById('admin-add-notice-form');
    if (addNoticeForm) {
      addNoticeForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('admin-notice-title').value.trim();
        const category = document.getElementById('admin-notice-cat').value;
        const priority = document.getElementById('admin-notice-priority').value;
        const today = new Date().toISOString().split('T')[0];

        appState.notices.unshift({
          id: `not-${Date.now()}`,
          date: today,
          category,
          title,
          priority
        });
        saveStore(appState);
        renderNotices();
        addNoticeForm.reset();
        showToast('নতুন নোটিশ যোগ করা হয়েছে!');
      });
    }

    const btnSaveMarquee = document.getElementById('btn-save-marquee');
    if (btnSaveMarquee) {
      btnSaveMarquee.addEventListener('click', () => {
        const val = document.getElementById('admin-marquee-input').value.trim();
        if (val) {
          appState.announcement = val;
          saveStore(appState);
          showToast('ঘোষণা সফলভাবে আপডেট করা হয়েছে!');
        }
      });
    }

    function renderApplications() {
      const tbody = document.getElementById('admin-applications-tbody');
      const countEl = document.getElementById('admin-app-count');
      if (countEl && appState.applications) countEl.textContent = appState.applications.length;
      if (!tbody || !appState.applications) return;

      const search = (document.getElementById('admin-search-applicant')?.value || '').toLowerCase();
      const streamFilter = document.getElementById('admin-filter-stream')?.value || 'ALL';
      const statusFilter = document.getElementById('admin-filter-status')?.value || 'ALL';

      const filtered = appState.applications.filter(app => {
        const matchesSearch = !search || app.studentName.toLowerCase().includes(search) || app.guardianName.toLowerCase().includes(search) || app.phone.includes(search);
        const matchesStream = streamFilter === 'ALL' || app.stream.includes(streamFilter);
        const matchesStatus = statusFilter === 'ALL' || app.status === statusFilter;
        return matchesSearch && matchesStream && matchesStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-500">কোনো ভর্তি আবেদন পাওয়া যায়নি।</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((app) => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 font-mono text-amber-300 font-bold">${app.id}</td>
          <td class="p-3 font-bold text-white">${app.studentName}</td>
          <td class="p-3 text-slate-300">${app.guardianName}</td>
          <td class="p-3 font-semibold text-emerald-300">${app.classApply}</td>
          <td class="p-3 text-slate-300">${app.stream}</td>
          <td class="p-3 font-mono text-slate-300">${app.phone}</td>
          <td class="p-3">
            <select class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] font-bold ${
              app.status === 'ভর্তি নিশ্চিত' ? 'text-emerald-400' : (app.status === 'যাচাই চলছে' ? 'text-amber-400' : 'text-blue-300')
            }" onchange="updateAppStatus('${app.id}', this.value)">
              <option value="নতুন আবেদন" ${app.status === 'নতুন আবেদন' ? 'selected' : ''}>নতুন আবেদন</option>
              <option value="যাচাই চলছে" ${app.status === 'যাচাই চলছে' ? 'selected' : ''}>যাচাই চলছে</option>
              <option value="ভর্তি নিশ্চিত" ${app.status === 'ভর্তি নিশ্চিত' ? 'selected' : ''}>ভর্তি নিশ্চিত</option>
            </select>
          </td>
          <td class="p-3 text-right">
            <button class="text-red-400 hover:text-red-300 p-1" onclick="deleteApplication('${app.id}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    window.updateAppStatus = function(appId, newStatus) {
      const app = appState.applications.find(a => a.id === appId);
      if (app) {
        app.status = newStatus;
        saveStore(appState);
        showToast(`${app.studentName}-এর স্ট্যাটাস: ${newStatus}`);
      }
    };

    window.deleteApplication = function(appId) {
      appState.applications = appState.applications.filter(a => a.id !== appId);
      saveStore(appState);
      renderApplications();
      showToast('আবেদনটি অপসারণ করা হয়েছে।');
    };

    const searchAppInput = document.getElementById('admin-search-applicant');
    const filterStreamSelect = document.getElementById('admin-filter-stream');
    const filterStatusSelect = document.getElementById('admin-filter-status');
    if (searchAppInput) searchAppInput.addEventListener('input', renderApplications);
    if (filterStreamSelect) filterStreamSelect.addEventListener('change', renderApplications);
    if (filterStatusSelect) filterStatusSelect.addEventListener('change', renderApplications);

    const btnExportCsv = document.getElementById('btn-export-admissions-csv');
    if (btnExportCsv) {
      btnExportCsv.addEventListener('click', () => {
        let csv = "ID,Student Name,Guardian Name,Class,Stream,Phone,Status,Date\n";
        appState.applications.forEach(a => {
          csv += `"${a.id}","${a.studentName}","${a.guardianName}","${a.classApply}","${a.stream}","${a.phone}","${a.status}","${a.date}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `iqra_admissions_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV ফাইল সফলভাবে ডাউনলোড হয়েছে!');
      });
    }

    // Manual Admission Modal
    const manualModal = document.getElementById('manual-adm-modal');
    const btnOpenManual = document.getElementById('btn-add-manual-admission');
    const btnCloseManual = document.getElementById('btn-close-manual-modal');
    const btnCancelManual = document.getElementById('btn-cancel-manual-modal');
    const manualForm = document.getElementById('manual-adm-form');

    if (btnOpenManual) btnOpenManual.addEventListener('click', () => manualModal.classList.remove('hidden'));
    if (btnCloseManual) btnCloseManual.addEventListener('click', () => manualModal.classList.add('hidden'));
    if (btnCancelManual) btnCancelManual.addEventListener('click', () => manualModal.classList.add('hidden'));

    if (manualForm) {
      manualForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const randId = `IQRA-2027-${Math.floor(1000 + Math.random() * 9000)}`;
        const newApp = {
          id: randId,
          studentName: document.getElementById('m-student-name').value.trim(),
          guardianName: document.getElementById('m-guardian-name').value.trim(),
          classApply: document.getElementById('m-class').value,
          stream: document.getElementById('m-stream').value,
          phone: document.getElementById('m-phone').value.trim(),
          status: "নতুন আবেদন",
          date: new Date().toISOString().split('T')[0]
        };
        appState.applications.unshift(newApp);
        saveStore(appState);
        renderApplications();
        manualForm.reset();
        manualModal.classList.add('hidden');
        showToast('ম্যানুয়াল আবেদন সফলভাবে রেজিস্টারে অন্তর্ভুক্ত!');
      });
    }

    function renderBanners() {
      const bannerList = document.getElementById('admin-banner-list');
      if (!bannerList || !appState.banners) return;
      bannerList.innerHTML = appState.banners.map((b, idx) => `
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row items-center gap-4">
          <img src="${b.url}" alt="Banner ${idx+1}" class="w-24 h-16 rounded-xl object-cover border border-slate-700 shrink-0">
          <div class="flex-1 w-full space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-amber-400">ব্যানার স্লাইড #${idx+1}</span>
            </div>
            <input type="text" id="admin-banner-url-${idx}" value="${b.url}" placeholder="ছবির লিংক URL..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white">
            <input type="text" id="admin-banner-title-${idx}" value="${b.title}" placeholder="ক্যাপশন শিরোনাম..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300">
          </div>
        </div>
      `).join('');
    }

    const btnSaveBanners = document.getElementById('btn-save-banners');
    if (btnSaveBanners) {
      btnSaveBanners.addEventListener('click', () => {
        appState.banners.forEach((b, idx) => {
          const u = document.getElementById(`admin-banner-url-${idx}`);
          const t = document.getElementById(`admin-banner-title-${idx}`);
          if (u) b.url = u.value.trim();
          if (t) b.title = t.value.trim();
        });
        saveStore(appState);
        showToast('ব্যানার স্লাইডার তথ্য সংরক্ষিত হয়েছে!');
      });
    }

    const btnSaveStats = document.getElementById('btn-save-stats');
    if (btnSaveStats) {
      btnSaveStats.addEventListener('click', () => {
        appState.stats.students = document.getElementById('admin-stat-students').value.trim();
        appState.stats.teachers = document.getElementById('admin-stat-teachers').value.trim();
        appState.stats.passRate = document.getElementById('admin-stat-pass').value.trim();
        appState.stats.helpline1 = document.getElementById('admin-stat-phone1').value.trim();
        appState.stats.helpline2 = document.getElementById('admin-stat-phone2').value.trim();
        appState.stats.estd = document.getElementById('admin-stat-estd').value.trim();
        saveStore(appState);
        showToast('পরিসংখ্যান ও ফোন নম্বর সংরক্ষিত হয়েছে!');
      });
    }

    // Change Credentials Form (Pure JS SHA-256)
    const changePassForm = document.getElementById('admin-change-pass-form');
    if (changePassForm) {
      changePassForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const curPass = document.getElementById('input-curr-pass').value.trim();
        const newPass = document.getElementById('input-new-pass').value.trim();
        const curPin = document.getElementById('input-curr-pin').value.trim();
        const newPin = document.getElementById('input-new-pin').value.trim();

        const hashedCurPass = sha256(curPass);
        const hashedCurPin = sha256(curPin);

        const targetL1 = appState.adminHashL1 || DEFAULT_HASH_L1;
        const targetL2 = appState.adminHashL2 || DEFAULT_HASH_L2;

        if (hashedCurPass !== targetL1) {
          showToast('বর্তমান লেয়ার ১ পাসওয়ার্ড সঠিক নয়!', 'error');
          return;
        }
        if (hashedCurPin !== targetL2) {
          showToast('বর্তমান লেয়ার ২ পিন সঠিক নয়!', 'error');
          return;
        }

        if (newPass.length < 4 || newPin.length < 3) {
          showToast('নতুন পাসওয়ার্ড বা পিন পর্যাপ্ত সুরক্ষিত নয়!', 'error');
          return;
        }

        appState.adminHashL1 = sha256(newPass);
        appState.adminHashL2 = sha256(newPin);
        saveStore(appState);
        changePassForm.reset();
        showToast('লেয়ার ১ ও ২ নিরাপত্তা সফলভাবে আপডেট হয়েছে!');
      });
    }

    const btnDownloadJson = document.getElementById('btn-download-json');
    if (btnDownloadJson) {
      btnDownloadJson.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `iqra_academy_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('JSON ব্যাকআপ ডাউনলোড সম্পন্ন হয়েছে!');
      });
    }

    const btnFactoryReset = document.getElementById('btn-factory-reset');
    if (btnFactoryReset) {
      btnFactoryReset.addEventListener('click', () => {
        if (confirm('আপনি কি নিশ্চিত যে সকল ডেটা ফ্যাক্টরি ডিফল্টে ফিরিয়ে নিতে চান?')) {
          appState = JSON.parse(JSON.stringify(DEFAULT_IQRA_STORE));
          saveStore(appState);
          renderDashboard();
          showToast('ফ্যাক্টরি রিসেট সম্পন্ন হয়েছে!');
        }
      });
    }

    checkAuth();
  </script>
</body>
</html>
